[package]
name = "minux-ide"
version = "0.1.0"
edition = "2021"
description = "Minimal native AI IDE foundation"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
egui_extras = { version = "0.31", default-features = false, features = ["svg", "syntect"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
