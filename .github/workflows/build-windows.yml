name: Build MINUX IDE (Windows)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build single executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/minux-ide.exe"
          if (!(Test-Path $exe)) {
            throw "Executable was not produced: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINUX-IDE-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/minux-ide.exe
          if-no-files-found: error
          retention-days: 14
