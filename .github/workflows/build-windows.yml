name: Build MINUX IDE (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install JDK for Kotlin tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install theme generation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install TypeScript tools
        run: npm install --no-audit --no-fund

      - name: Generate theme catalog through XSLT
        run: python scripts/generate_themes.py

      - name: Audit polyglot source tree
        run: python scripts/project_audit.py .

      - name: Check TypeScript and JavaScript model utilities
        run: |
          npm run typecheck
          npm run test:js

      - name: Test and run Kotlin workspace tools
        run: |
          gradle -p kotlin test
          gradle -p kotlin run --args=".."

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Rust UI host and native C core
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/minux-ide.exe"
          if (!(Test-Path $exe)) {
            throw "Executable was not produced: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MINUX-IDE-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/minux-ide.exe
          if-no-files-found: error
          retention-days: 14
